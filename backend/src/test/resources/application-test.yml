server:
  port: 0
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/test_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: change-me
  flowable:
    database-schema-update: true
    async-executor-activate: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.testplatform.*.domain.po
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.example.testplatform.*.mapper: debug
flowable:
  async-executor-activate: false
jwt:
  secret: test-only-jwt-secret-key-for-hs256-algorithm
  expiration: 86400000
  refresh-expiration: 604800000
